# XcodeGen spec. `xcodegen generate` writes NanoCortexEditor.xcodeproj (git-ignored).
name: NanoCortexEditor
options:
  bundleIdPrefix: com.community
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NanoCore:
    path: NanoCore
targets:
  NanoCortexEditor:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/icon.svg
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: NanoCore
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      base:
        PRODUCT_NAME: Nano Cortex Editor
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.community.nanocortex
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nano Cortex Editor
        INFOPLIST_KEY_NSHumanReadableCopyright: "Unofficial. Not affiliated with Neural DSP."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Nano Cortex Editor connects to your Nano Cortex over Bluetooth to read and edit presets."
    scheme:
      testTargets: [NanoCortexEditorTests, NanoCortexEditorUITests]
    info:
      path: App/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
        NSBluetoothAlwaysUsageDescription: "Nano Cortex Editor connects to your Nano Cortex over Bluetooth to read and edit presets."
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Unofficial. Not affiliated with Neural DSP."
  # Unit tests for the app's pure code. Not hosted: the pure files are compiled into the bundle, so running the
  # tests never launches the app (which would connect to the remembered pedal).
  NanoCortexEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
      - path: App/Sources/MetronomePattern.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.community.nanocortex.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
  NanoCortexEditorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [App/UITests]
    dependencies:
      - target: NanoCortexEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.community.nanocortex.uitests
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NanoCortexEditor
        SWIFT_STRICT_CONCURRENCY: minimal

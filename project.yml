# XcodeGen spec. `xcodegen generate` writes NanoCortexEditor.xcodeproj (git-ignored).
name: NanoCortexEditor
options:
  bundleIdPrefix: com.community
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NanoCore:
    path: NanoCore
  # Update notifications and one-click install (DECISIONS #23). Pinned: bump it here on purpose, then check a dry run
  # of release.yml (the release re-signs Sparkle's helpers and generates the appcast with this version's tools).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  NanoCortexEditor:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/icon.svg
        buildPhase: resources
      # Sparkle's licence (MIT, plus the BSD/zlib notices of the parts it bundles) ships with the binary it covers.
      - path: App/Resources/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: NanoCore
      - package: Sparkle
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      base:
        PRODUCT_NAME: Nano Cortex Editor
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.community.nanocortex
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nano Cortex Editor
        INFOPLIST_KEY_NSHumanReadableCopyright: "Unofficial. Not affiliated with Neural DSP."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Nano Cortex Editor connects to your Nano Cortex over Bluetooth to read and edit presets."
    scheme:
      testTargets: [NanoCortexEditorTests, NanoCortexEditorUITests]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ATSApplicationFontsPath: Fonts
        NSBluetoothAlwaysUsageDescription: "Nano Cortex Editor connects to your Nano Cortex over Bluetooth to read and edit presets."
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Unofficial. Not affiliated with Neural DSP."
        # Sparkle (DECISIONS #23). The feed is the appcast.xml asset of the latest GitHub Release (release.yml uploads
        # it); `UpdateFeed.url` in Updates.swift holds the same string and UpdatesTests checks they match.
        SUFeedURL: "https://github.com/AJs-Creations/nano-cortex-editor-mac/releases/latest/download/appcast.xml"
        # The EdDSA public key. Its private key is in 1Password (Apple Signing → "Sparkle Update Signing Key") and in
        # Anup's login Keychain (`generate_keys --account nano-cortex-editor-mac -p` prints this value).
        SUPublicEDKey: "7dmHJiU3E5KZ2dqM9HfbKriFRH+bjhV2uf0qgx7vSeU="
        # On by default with no "check automatically?" prompt (Anup); Settings → Advanced turns it off.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # No silent download-and-install by default (the update alert's checkbox can still turn it on).
        SUAutomaticallyUpdate: false
        # The private drag type of a preset row (PresetReorder.swift): only drags that start on the preset list.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.community.nanocortex.preset-row
            UTTypeDescription: Nano Cortex preset row
            UTTypeConformsTo: [public.data]
  # Unit tests for the app's pure code. Not hosted: the pure files are compiled into the bundle, so running the
  # tests never launches the app (which would connect to the remembered pedal).
  NanoCortexEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
      - path: App/Sources/MetronomePattern.swift
      - path: App/Sources/ClickSound.swift
      - path: App/Sources/MetronomeSounds.swift
      - path: App/Sources/Links.swift
      - path: App/Sources/LogFile.swift
      - path: App/Sources/DevTools.swift
      - path: App/Sources/PedalLink.swift
      - path: App/Sources/Updates.swift
      - path: App/Sources/AuditionGate.swift
      - path: App/Sources/LiveMath.swift
      - path: App/Sources/CaptureKind.swift
      - path: App/Sources/DevRemoteRequest.swift
      - path: App/Sources/QuitGuard.swift
    # The quit tests drive QuitGuard against NanoCore's fake pedal (no app, no Bluetooth).
    dependencies:
      - package: NanoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.community.nanocortex.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
  NanoCortexEditorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [App/UITests]
    dependencies:
      - target: NanoCortexEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.community.nanocortex.uitests
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NanoCortexEditor
        SWIFT_STRICT_CONCURRENCY: minimal
